services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dispatch_net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - dispatch_net

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dispatch_net

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: http://localhost
      MONGO_URI: ${MONGO_URI_AUTH:-mongodb://mongo:27017/auth_db}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_ACCESS_SECRET: your_super_secret_access_key_min_32_chars_long
      JWT_REFRESH_SECRET: your_super_secret_refresh_key_min_32_chars_long
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - dispatch_net

  driver-service:
    build:
      context: .
      dockerfile: services/driver/Dockerfile
    container_name: driver-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      CORS_ORIGIN: http://localhost
      MONGO_URI: ${MONGO_URI_DRIVER:-mongodb://mongo:27017/driver_db}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_ACCESS_SECRET: your_super_secret_access_key_min_32_chars_long
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - dispatch_net

  trip-service:
    build:
      context: .
      dockerfile: services/trip/Dockerfile
    container_name: trip-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      CORS_ORIGIN: http://localhost
      MONGO_URI: mongodb://mongo:27017/trip_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - dispatch_net

  matching-service:
    build:
      context: .
      dockerfile: services/matching/Dockerfile
    container_name: matching-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      CORS_ORIGIN: http://localhost
      MONGO_URI: mongodb://mongo:27017/matching_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - dispatch_net

  pricing-service:
    build:
      context: .
      dockerfile: services/pricing/Dockerfile
    container_name: pricing-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      CORS_ORIGIN: http://localhost
      MONGO_URI: mongodb://mongo:27017/pricing_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - dispatch_net

  realtime-service:
    build:
      context: .
      dockerfile: services/realtime/Dockerfile
    container_name: realtime-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3006
      CORS_ORIGIN: http://localhost
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - dispatch_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    restart: unless-stopped
    networks:
      - dispatch_net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - frontend
      - auth-service
      - driver-service
      - trip-service
      - matching-service
      - pricing-service
      - realtime-service
    networks:
      - dispatch_net

networks:
  dispatch_net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
