events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 10M;

    upstream auth { server auth-service:3001; }
    upstream driver { server driver-service:3002; }
    upstream trip { server trip-service:3003; }
    upstream matching { server matching-service:3004; }
    upstream pricing { server pricing-service:3005; }
    upstream realtime { server realtime-service:3006; }
    upstream web { server frontend:8080; }

    server {
        listen 8080;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location /api/auth/ { proxy_pass http://auth/; }
        location /api/drivers/ { proxy_pass http://driver/; }
        location /api/trips/ { proxy_pass http://trip/; }
        location /api/matching/ { proxy_pass http://matching/; }
        location /api/pricing/ { proxy_pass http://pricing/; }

        location /socket.io/ {
            proxy_pass http://realtime/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / { proxy_pass http://web/; }
    }
}
